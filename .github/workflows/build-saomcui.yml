name: Build SAOMCUI Forge 1.20.1
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'codigo/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect project
        run: |
          echo "Files at repository root:"
          ls -la
          echo "Build scripts:"
          find . -maxdepth 3 \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradlew' -o -name 'pom.xml' \) -print
      - name: Build with Gradle if wrapper exists
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon build
          elif [ -f ./build.gradle ] || [ -f ./build.gradle.kts ]; then
            echo "Gradle build script exists but wrapper is missing; install Gradle and attempt build."
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle --no-daemon build
          else
            echo "::error::No Gradle build script or wrapper exists. Source is not yet a compilable project."
            exit 1
          fi
      - name: Upload built JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: saomcui-build
          path: build/libs/*.jar
          if-no-files-found: error
